services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliverable-bob
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=development
      - SESSION_SECRET=deliverable_bob_secret_key
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql://deliverable_bob_db_user:TFJsAMZZwAQI5j1icEDlULIeUN1SKySa@dpg-d8bgb7sp3tds73bnrb00-a.oregon-postgres.render.com/deliverable_bob_db
      - REDIS_URL=rediss://default:kfQpEIKbqgNytrUg7MRsx8cXRBOKVSVSZAzCaCyNINM%3D@deliverable-bob-redis.redis.cache.windows.net:6380
    command: sh -c "node node_modules/prisma/build/index.js db push && node dist/app.js"
    restart: unless-stopped

  worker:
    volumes:
      - .:/app
      - /app/node_modules
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliverable-bob-worker
    environment:
      - NODE_ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql://deliverable_bob_db_user:TFJsAMZZwAQI5j1icEDlULIeUN1SKySa@dpg-d8bgb7sp3tds73bnrb00-a.oregon-postgres.render.com/deliverable_bob_db
      - REDIS_URL=rediss://default:kfQpEIKbqgNytrUg7MRsx8cXRBOKVSVSZAzCaCyNINM%3D@deliverable-bob-redis.redis.cache.windows.net:6380
    command: node dist/workers/ingestion.worker.js
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: deliverable-bob-db
    environment:
      - POSTGRES_USER=bob
      - POSTGRES_PASSWORD=bob_password
      - POSTGRES_DB=deliverable_bob
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bob -d deliverable_bob"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: deliverable-bob-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
