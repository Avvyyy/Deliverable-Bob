services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliverable-bob
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=development
      - SESSION_SECRET=deliverable_bob_secret_key
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql://bob:bob_password@db:5432/deliverable_bob?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npm run db:push && npm run dev"
    restart: unless-stopped

  worker:
    volumes:
      - .:/app
      - /app/node_modules
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliverable-bob-worker
    environment:
      - NODE_ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql://bob:bob_password@db:5432/deliverable_bob?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run dev:worker
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: deliverable-bob-db
    environment:
      - POSTGRES_USER=bob
      - POSTGRES_PASSWORD=bob_password
      - POSTGRES_DB=deliverable_bob
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bob -d deliverable_bob"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: deliverable-bob-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
