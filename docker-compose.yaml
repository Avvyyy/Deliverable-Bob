version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliverable-bob
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./dist:/app/dist
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json

  db:
    image: postgres:16-alpine
    container_name: deliverable-bob-db
    environment:
      - POSTGRES_USER=bob
      - POSTGRES_PASSWORD=bob_password
      - POSTGRES_DB=deliverable_bob
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
