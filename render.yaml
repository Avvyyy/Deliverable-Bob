services:
  - type: web
    name: deliverable-bob-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start
    preDeployCommand: npm run db:push
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: deliverable-bob-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: deliverable-bob-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  - type: worker
    name: deliverable-bob-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deliverable-bob-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: deliverable-bob-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  - type: keyvalue
    name: deliverable-bob-redis
    plan: free
    ipAllowList: []

databases:
  - name: deliverable-bob-db
    plan: free
    databaseName: deliverable_bob
    user: bob
